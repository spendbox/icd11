<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Harvey Road General Hospital Yaba crest">
  <defs>
    <linearGradient id="hrghShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7c86"/>
      <stop offset="1" stop-color="#0a5560"/>
    </linearGradient>
    <linearGradient id="hrghRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28c0c8"/>
      <stop offset="1" stop-color="#0e7c86"/>
    </linearGradient>
  </defs>
  <!-- outer ring -->
  <circle cx="60" cy="60" r="57" fill="#ffffff" stroke="url(#hrghRing)" stroke-width="5"/>
  <!-- shield -->
  <path d="M60 16 L96 28 V60 C96 84 80 98 60 106 C40 98 24 84 24 60 V28 Z" fill="url(#hrghShield)"/>
  <!-- inner shield outline -->
  <path d="M60 24 L88 33 V60 C88 80 75 92 60 99 C45 92 32 80 32 60 V33 Z" fill="none" stroke="#9fe9ec" stroke-width="1.4" opacity="0.7"/>
  <!-- medical cross -->
  <g fill="#ffffff">
    <rect x="54" y="38" width="12" height="44" rx="2.5"/>
    <rect x="38" y="54" width="44" height="12" rx="2.5"/>
  </g>
  <!-- rod of Asclepius serpent accent -->
  <path d="M60 34 C70 40 50 48 60 54 C70 60 50 68 60 74" fill="none" stroke="#28c0c8" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
  <!-- initials -->
  <text x="60" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="700" fill="#0a5560" letter-spacing="1">HRGH</text>
</svg>
